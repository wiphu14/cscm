name: resident_alert
description: แอปลูกบ้าน — รับแจ้งเตือนผู้เข้าหมู่บ้านแบบเรียลไทม์
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (ต้องรัน: flutterfire configure)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # HTTP
  http: ^1.2.2

  # Local storage (เก็บ house_number, user_id)
  shared_preferences: ^2.3.2

  # UUID สำหรับสร้าง user_id เฉพาะเครื่อง
  uuid: ^4.4.0

  # Font
  google_fonts: ^6.2.1

  # Permission handler (Android 13+ notification permission)
  permission_handler: ^11.3.1

  # Intl (format วันที่ภาษาไทย)
  intl: ^0.19.0
  flutter_local_notifications: ^20.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# หลังเพิ่ม dependencies รัน:
#   flutter pub get
#   flutterfire configure   ← เชื่อม Firebase project เดียวกับ village-entry app